services:
  mrt-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: mrt-dashboard
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - PORT=3010
      - NODE_ENV=production
    volumes:
      - ./dashboard/public:/app/public:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3010/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
