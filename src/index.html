<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>MRT Station - Samsung Node Agent</title>

  <!-- OpenGraph Metadata -->
  <meta property="og:title" content="MRT Station - Samsung Node Agent">
  <meta property="og:description" content="Distributed node agent and diagnostics management for Samsung devices.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mrt.endrisusanto.my.id">
  <meta property="og:image" content="https://mrt.endrisusanto.my.id/og-image.png">

  <!-- CSS Design System -->
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/mobile.css">
</head>
<body>
  <!-- Inline SVG Definition Symbols -->
  <svg style="display: none;">
    <symbol id="icon-server" viewBox="0 0 24 24">
      <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
      <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
      <line x1="6" y1="6" x2="6.01" y2="6"></line>
      <line x1="6" y1="18" x2="6.01" y2="18"></line>
    </symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24">
      <rect x="4" y="4" width="16" height="16" rx="2"></rect>
      <rect x="9" y="9" width="6" height="6"></rect>
      <line x1="9" y1="1" x2="9" y2="4"></line>
      <line x1="15" y1="1" x2="15" y2="4"></line>
      <line x1="9" y1="20" x2="9" y2="23"></line>
      <line x1="15" y1="20" x2="15" y2="23"></line>
      <line x1="20" y1="9" x2="23" y2="9"></line>
      <line x1="20" y1="14" x2="23" y2="14"></line>
      <line x1="1" y1="9" x2="4" y2="9"></line>
      <line x1="1" y1="14" x2="4" y2="14"></line>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <polyline points="23 4 23 10 17 10"></polyline>
      <polyline points="1 20 1 14 7 14"></polyline>
      <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
    </symbol>
    <symbol id="icon-usb" viewBox="0 0 24 24">
      <circle cx="10" cy="4" r="2"></circle>
      <circle cx="18" cy="8" r="2"></circle>
      <circle cx="6" cy="16" r="2"></circle>
      <path d="M12 2v20"></path>
      <path d="M12 12h4a2 2 0 0 0 2-2V8"></path>
      <path d="M12 16H8a2 2 0 0 1-2-2v-2"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <polyline points="3 6 5 6 21 6"></polyline>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
    </symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24">
      <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
    </symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3"></circle>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
    </symbol>
  </svg>

  <div class="app-shell">
    <!-- Header -->
    <header class="app-header">
      <div class="brand-section">
        <svg class="icon" style="color: var(--color-blue); width: 18px; height: 18px;"><use href="#icon-cpu"></use></svg>
        <h1 class="brand-title">MRT STATION</h1>
        <span class="brand-badge">NODE v2.0</span>
      </div>

      <div class="header-actions">
        <button id="btn-refresh" class="btn btn-secondary" aria-label="Scan Devices">
          <svg class="icon"><use href="#icon-refresh"></use></svg>
          <span>Scan</span>
        </button>
        <button id="btn-theme-toggle" class="btn-icon" aria-label="Toggle Color Theme" title="Toggle theme">
          <svg id="theme-icon-dark" class="icon"><use href="#icon-sun"></use></svg>
          <svg id="theme-icon-light" class="icon" style="display: none;"><use href="#icon-moon"></use></svg>
        </button>
      </div>
    </header>

    <!-- Underline Progress Bar for Global Operations -->
    <div class="underline-progress-bar" id="global-progress">
      <div class="underline-progress-fill" id="global-progress-fill"></div>
    </div>

    <!-- Main Content Pane -->
    <main class="app-main">
      <section class="content-pane" id="pane-devices">
        <!-- Node Status Bar -->
        <div class="node-bar">
          <div class="node-stat-card">
            <span class="stat-label">Agent Node</span>
            <span class="stat-value font-mono" id="stat-node-id">Connecting...</span>
            <span class="stat-sub font-mono" id="stat-node-ip">Port 7890</span>
          </div>
          <div class="node-stat-card">
            <span class="stat-label">Connected Devices</span>
            <span class="stat-value" id="stat-device-count">0</span>
            <span class="stat-sub">Hardware Ready</span>
          </div>
          <div class="node-stat-card">
            <span class="stat-label">Station Uptime</span>
            <span class="stat-value font-mono" id="stat-uptime">0s</span>
            <span class="stat-sub">Local Standalone</span>
          </div>
        </div>

        <!-- Devices Section Header -->
        <div class="section-header">
          <h2 class="section-title">
            <svg class="icon"><use href="#icon-usb"></use></svg>
            <span>Connected Devices</span>
          </h2>
          <span class="stat-sub" id="device-scan-status">Idle</span>
        </div>

        <!-- Device Cards Grid -->
        <div class="device-grid" id="devices-container">
          <!-- Populated by JavaScript -->
        </div>

        <!-- Empty State Container (Hidden when devices exist) -->
        <div class="empty-state" id="devices-empty" style="display: none;">
          <svg class="empty-icon"><use href="#icon-usb"></use></svg>
          <div class="empty-title">No Samsung Devices Connected</div>
          <div class="empty-desc">
            Connect a device via USB cable with USB debugging enabled, then click Scan to detect hardware.
          </div>
          <button id="btn-empty-scan" class="btn btn-primary" style="margin-top: var(--space-sm);">
            <svg class="icon"><use href="#icon-refresh"></use></svg>
            <span>Scan Devices</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Mobile Bottom Navigation (< 768px) -->
    <nav class="mobile-nav" aria-label="Mobile Navigation">
      <button class="mobile-nav-item active" id="nav-item-devices" aria-label="Devices View">
        <svg class="icon"><use href="#icon-usb"></use></svg>
        <span>Devices</span>
      </button>
      <button class="mobile-nav-item" id="nav-item-actions" aria-label="Batch Actions">
        <svg class="icon"><use href="#icon-activity"></use></svg>
        <span>Actions</span>
      </button>
      <button class="mobile-nav-item" id="nav-item-node" aria-label="Node Info">
        <svg class="icon"><use href="#icon-server"></use></svg>
        <span>Node</span>
      </button>
      <button class="mobile-nav-item" id="nav-item-settings" aria-label="Station Settings">
        <svg class="icon"><use href="#icon-settings"></use></svg>
        <span>Settings</span>
      </button>
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toast-container" role="status" aria-live="polite"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
